{% extends "enfermagem/base.html" %}
{% block titulo %}Acompanhar chamado — Hospital Rio Grande{% endblock %}
{% block body_classe %}pagina-paciente{% endblock %}

{% block conteudo %}
<div class="app-paciente">
  <header class="cabecalho-paciente">
    <div class="linha-topo-paciente">
      <a class="botao-voltar" href="{{ url_for('enfermagem_pages.paciente_inicio') }}" aria-label="Novo chamado">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
      </a>
      <span class="marca-paciente">Chamador de Enfermagem</span>
      <div style="width:34px;"></div>
    </div>
  </header>

  <main class="tela-paciente" id="telaAcompanhar">
    <p class="texto-carregando">Carregando chamado...</p>
  </main>
</div>
{% endblock %}

{% block scripts %}
<script>
  window.CHAMADO_ID = {{ chamado_id }};
</script>
<script src="{{ url_for('static', filename='js/enfermagem/acompanhar.js') }}"></script>
{% endblock %}
